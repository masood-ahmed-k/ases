# Provider limits and model declarations. Section 5.3 of the blueprint: these numbers were read from
# the providers' own pages and the installed Hermes source on 17-18 September 2026. They change --
# re-verify before trusting them for real capacity planning, and update verified_on when you do.
#
# context_length: null means undeclared/unverified (ASES-MOD-02). The floor is Hermes's own 64,000 tokens
# (models.MINIMUM_CONTEXT_LENGTH). Since round 11, a PINNED model below it, or undeclared on a custom
# openai_compatible provider, is rejected before any card starts (swarm approve and swarm run refuse; swarm
# doctor shows FAIL); an unpinned candidate only WARNs.
#
# ASES-PRV-04 (section 21.2): "private/confidential projects require an EXPLICITLY VERIFIED provider data
# policy" -- a data_policy string alone is not enough for those two data classes. Two OPTIONAL fields, same
# convention as verified_on above (a source and a date, never invented): data_policy_verified_at (an ISO
# date string, quoted) records WHEN a human actually checked the data_policy line below it, and
# data_policy_source (a URL or a short note) records WHERE that check came from. Both are commented out
# below, next to each provider's data_policy, showing the shape; filling in a real date is a human decision
# (policy.check_data_class refuses private/confidential for a provider with no data_policy_verified_at, even
# one whose data_policy string would otherwise qualify).

providers:
  # unorouter (base_url https://api.unorouter.com/v1) was removed entirely 2026-09-19, per an explicit
  # user decision ("dont use unorouter at all - its complete waste"), not just left demoted like the
  # models.yaml `_retired` rows elsewhere in this file. It was the source of nearly every real provider
  # problem hit all night: an undeclared per-model daily token cap, an output-tokens-per-minute cap,
  # a gate command its own terminal tool refused as "dangerous", and recurring transient "service
  # unavailable" errors that kept sending real dispatch attempts back to blocked. Both roles that used
  # it (lead, coder) have moved to xkiro. Its exact former config (base_url, key_env, limits, real
  # observed numbers) is preserved in git history, not reproduced here -- this is a closed decision, not
  # a "revive later" one like the unfunded xkiro rows below.

  openrouter:
    type: openrouter
    key_env: OPENROUTER_API_KEY
    credits_purchased: false        # ASES-CAP-05: flip this only after the user makes that purchase
    limits:
      rpm: 20
      per_day_default: 50           # credits_purchased: false
      per_day_after_credits: 1000   # credits_purchased: true
    quota_endpoint: /api/v1/key
    require_parameters: true
    data_policy: some_free_endpoints_train
    # data_policy_verified_at: "2026-09-17"    # ASES-PRV-04 shape, not a live value: set only once a human
    # data_policy_source: "<url or note>"      # has actually re-checked the data_policy line above and can
    #                                           # cite where (this provider is not yet safe for
    #                                           # private/confidential regardless: see policy._SAFE_FOR_PRIVATE).
    verified_on: "2026-09-17"
    # ASES-VER-01 (5.3, Appendix E): the page the limits above were read from, so swarm doctor can show it.
    # Blueprint Appendix E, [S12]: "OpenRouter API limits: free-model request caps, account-wide limits, key
    # endpoint". A source is always a real page someone checked, with the date in verified_on and what the page
    # says in a comment: never a URL guessed to fill the field.
    source: "https://openrouter.ai/docs/api-reference/limits"

  xkiro:
    type: openai_compatible          # a router (like unorouter/openrouter), not a single vendor: one
    base_url: https://api.xkiro.com/v1  # key, 111+ models across 16 providers behind an OpenAI/
                                         # Anthropic-compatible API. Model IDs are vendor/model-prefixed
                                         # (confirmed against https://docs.xkiro.com/, 2026-09-19).
    key_env: XKIRO_API_KEY
    limits: {}                        # unknown -- not published anywhere seen yet; re-verify once real
                                       # usage exposes a 429 (the pattern every other provider's real
                                       # limits in this file were actually learned).
    quota_endpoint: null
    data_policy: router_ztr_upstream_varies   # 2026-09-19, from xKiro's own privacy policy
                                               # (https://xkiro.com/privacy): "Zero Data Retention for
                                               # content: we do NOT persist your request or response
                                               # bodies, nor request headers" (narrow exception: brief
                                               # diagnostic logging on errors, auto-deleted). That covers
                                               # xKiro's OWN handling -- it says nothing about what the
                                               # 16 different upstream vendors it routes to do once a
                                               # request reaches them, and that varies per vendor. Not
                                               # given a _SAFE_FOR_PRIVATE marker at the provider level
                                               # for that reason (same logic as unorouter's
                                               # forwards_to_upstreams_that_may_train) -- see the
                                               # gpt-5.6-terra model row below for the one specific
                                               # routed model actually checked end-to-end.
    # data_policy_verified_at: "2026-09-19"    # ASES-PRV-04 shape, not a live value (see the openrouter block
    # data_policy_source: "<url or note>"      # above for what these two fields mean).
    verified_on: "2026-09-28"
    # ASES-VER-01: xKiro's own rate-limits reference page, checked 2026-09-28 at the owner's request. It
    # documents the kinds of limit (requests per minute, free tokens per day, spending windows, concurrent
    # jobs) and says free-model requests past a limit get a 429, but gives no numbers ("per plan"), which is
    # why `limits` above stays {}. A promotional page (https://xkiro.com/deals) quotes 500,000 free tokens a
    # day; that is marketing, not a reference, so it is not used as the limit.
    source: "https://docs.xkiro.com/api/rate-limits/"

  opencode_free:
    type: hermes_provider
    provider_id: opencode-free
    key_env: null                   # served anonymously: no key, no credential pool
    limits: {}
    data_policy: unknown
    # data_policy_verified_at: "2026-09-17"    # ASES-PRV-04 shape, not a live value (see the openrouter block
    # data_policy_source: "<url or note>"      # above for what these two fields mean).
    verified_on: "2026-09-28"
    # ASES-VER-01: OpenCode's own Zen docs, checked 2026-09-28. It lists the current free models ("free on
    # OpenCode for a limited time") and publishes no request limits. The blueprint's own citation for this
    # provider ([S11], https://opencode.ai/docs/providers) does not discuss the free tier at all, so this page
    # is the better source. The client-only restriction behind `status: blocked` below is not documented by
    # OpenCode; it was found empirically. The installed Hermes 0.21.3's opencode-free plugin directory is empty.
    source: "https://opencode.ai/docs/zen/"
    status: blocked                 # 2026-09-18: HTTP 403 "OpenCode's free tier can only be used
                                     # from within OpenCode" -- confirmed against nemotron-3-ultra-free.
                                     # Server-side client check, not a per-model issue; do not retry
                                     # other opencode-free models expecting a different result.

models:
  - provider: xkiro
    model: "openai/gpt-5.6-terra"     # xKiro's vendor-prefixed model ID, not OpenAI's own bare
                                      # "gpt-5.6-terra" -- this provider is the router, not OpenAI direct.
    context_length: 1050000          # OpenAI's own docs, 2026-09-19: 1.05M context, 128K max output.
    tool_calling: true               # OpenAI's own docs list function calling as supported.
    role_class: lead_unfunded         # 2026-09-19: real HTTP 403 against a real key -- "This premium
                                      # model requires an active paid plan or real deposited balance...
                                      # promotional/bonus credits do not apply." Confirmed the key/wiring
                                      # itself is fine by immediately re-running the identical prompt
                                      # against a free model on the same key, which worked. Not pinned,
                                      # not deleted: revive this row (role_class: lead, pinned: true) once
                                      # the xKiro wallet actually has a balance -- gpt-5.6-terra is still
                                      # the better pick for reliability than any free model here.
    pinned: false
    paid: true                        # round 19, package STOPGATES (ASES-DOC-04, stop condition category 1
                                      # 'spends money'): the real HTTP 403 above IS the fact this field
                                      # records. Refused at the budget gate, Gate P and recovery.next_model
                                      # unless config/swarm.yaml sets budgets.allow_paid_models: true.
    data_policy: no_training          # see the discussion this had when it was still the pinned row,
                                      # preserved in git history / docs/architecture.md.

  - provider: xkiro
    model: "qwen/qwen3.8-max"         # the PAID tier of the model actually in use below -- also hit
    context_length: 1050000           # "pay-as-you-go premium model requires real deposited balance"
    tool_calling: true                # on the same (second) key, so this is the same funding blocker,
    role_class: lead_unfunded          # not a different problem. Revive alongside gpt-5.6-terra above
    pinned: false                      # once funded, and compare which is actually more reliable for
                                        # real -- this file isn't claiming one beats the other yet.
    paid: true                         # round 19, package STOPGATES: same fact as the row above.

  - provider: xkiro
    model: "qwen/qwen3.8-max:free"
    context_length: 1050000          # xKiro's own catalog page, 2026-09-19; not independently confirmed.
    tool_calling: true               # verified 2026-09-19: real terminal tool call, correct answer.
    role_class: lead
    pinned: true
    data_policy: router_ztr_upstream_varies   # see the xkiro provider block's note above; this is the
                                               # provider-level policy, same caveat applies to every
                                               # model routed through xkiro regardless of upstream vendor.
    # 2026-09-19: both xKiro keys the user created so far are unfunded wallets -- gpt-5.6-terra and
    # qwen/qwen3.8-max (paid) both refused with the same "needs real balance" 403. This free tier is
    # what's actually usable right now. Open question, partly answered: does "Qwen3.8 Max" (a
    # flagship-tier model in its own family, unlike coder-1's smaller qwen3.8-27b) actually clear the
    # complex-structured-task bar that glm-5.3-thinking:free failed? On 2026-09-19 it wrote a valid,
    # complete plan.json on the first try for a two-task request (project slug, dependency, touches,
    # acceptance criteria, a real gate command, estimates), and that plan was not edited before
    # approval. One small plan is evidence, not a verdict: a larger, ambiguous request is still untested.

  - provider: xkiro
    model: "qwen/qwen3-coder-plus:free"   # xKiro's own catalog: 1.05M context, purpose-built for coding.
    context_length: 1050000               # xKiro's own catalog page, 2026-09-19; not independently
                                           # confirmed against a real Hermes context-probe yet.
    tool_calling: true                    # verified 2026-09-19: real terminal tool call on the real
                                           # coder-1 profile, and a real kanban card completed (below).
    role_class: coder
    pinned: true
    data_policy: router_ztr_upstream_varies   # see the xkiro provider block's note near the top of this
                                               # file -- same caveat applies to every model routed
                                               # through xkiro, this one included.
    # 2026-09-19: "switch coder-1 to xkiro" -- the user's call right after switching lead there too,
    # given UnoRouter's accumulated real flakiness above. Picked the coding-specialized free model
    # (qwen3-coder-plus) over reusing lead's qwen3.8-max:free, on the theory that a model actually
    # marketed for code generation is a better fit for the coder role specifically than a general
    # flagship-reasoning model. Own key, separate from lead's (per-profile isolation habit, not a
    # known xKiro requirement). Result, stated precisely: with that key it claimed the real T1 card
    # (07:42:47), found hello.py already committed on the branch by an EARLIER UnoRouter-era attempt
    # (commit c23b684, authored 00:00, one file, inside the card's touches), ran `python hello.py` to
    # verify it, and completed the card at 07:43:51. So it had verified and completed real work on a real
    # card, but not yet authored any.
    # Later the same day, on the greet-e2e run (docs/architecture.md), it DID author real work on a real
    # card: commit 12995fc (greet.py and test_greet.py, both inside the card's touches), ran the card's gate
    # itself (2 passed) and handed off for review with the evidence metadata, in 2 m 49 s, 21 tool calls.
    # It also pip-installed pytest into Hermes's own virtualenv, outside its worktree, and said so itself.

  # Coding candidates evaluated 2026-09-19 at the user's suggestion ("minimax could be better option when
  # it comes to coding and development"). One identical real task (write a slugify() function to a spec,
  # verify it with the terminal tool) run once per model through coder-1's existing key with -m, graded by
  # a hidden 10-case check run afterwards: qwen3-coder-plus 10/10 in 142s, minimax-m3 10/10 in 133s,
  # minimax-m2.5 10/10 in 194s (and it answered with a summary when told to reply with just "done").
  # Verdict: MiniMax works in this harness (real tool calls, correct code) and nothing here separates the
  # three -- n=1 on an easy task can't rank models. Not pinned, not promoted; compare on something harder
  # (a fix card, a multi-file task) before switching a role. No separate key is needed: xKiro keys are not
  # model-scoped (the same key has served several different models tonight).
  - provider: xkiro
    model: "minimax/minimax-m3:free"
    context_length: 1000000               # xKiro's dashboard, 2026-09-19: "1M context ... for frontier
                                           # coding and agentic tasks"; not independently confirmed.
    tool_calling: true                    # verified 2026-09-19, see the evaluation note above.
    role_class: coder_candidate
    pinned: false

  - provider: xkiro
    model: "minimax/minimax-m2.5:free"
    context_length: 204000                # xKiro's dashboard, 2026-09-19 (listed as 204K).
    tool_calling: true                    # verified 2026-09-19, see the evaluation note above.
    role_class: coder_candidate
    pinned: false

  - provider: openrouter
    model: "cohere/north-mini-code:free"
    context_length: 256000
    tool_calling: true               # verified 2026-09-18
    role_class: reviewer
    pinned: true
    data_policy: some_free_endpoints_train
    # First real reviews, 2026-09-19 (greet-e2e): it completed two review runs correctly through the Kanban
    # tools. G1 (a coder diff): read both changed files, tried to run the tests, could not (the reviewer has
    # no terminal tool, by design), and approved anyway with review_outcome metadata; 5 API calls, 92,785
    # input tokens, 1,585 output tokens. G2 (a review-only task): PASS in 13 s. Weakness worth knowing: its
    # approval listed the gate as verified although it had only the coder's word for it. n=2 on trivially
    # small changes says nothing about whether it catches a real defect.
