# Provider limits and model declarations. Section 5.3 of the blueprint: these numbers were read from
# the providers' own pages and the installed Hermes source on 17-18 September 2026. They change --
# re-verify before trusting them for real capacity planning, and update verified_on when you do.
#
# context_length: null means undeclared/unverified (ASES-MOD-02). swarm doctor WARNs on every such row
# until a smoke test or an explicit number here confirms the Hermes floor of 65536 tokens.

providers:
  unorouter:
    type: openai_compatible
    base_url: https://api.unorouter.com/v1
    key_env: HERMES_CUSTOM_UNOROUTER_API_KEY   # Hermes's real generated name for this custom provider,
                                                # not the illustrative "UNOROUTER_API_KEY" in Appendix B.
    limits:
      per_model_rpm: 1
    quota_endpoint: null
    data_policy: forwards_to_upstreams_that_may_train
    verified_on: "2026-09-17"

  openrouter:
    type: openrouter
    key_env: OPENROUTER_API_KEY
    credits_purchased: false        # ASES-CAP-05: flip this only after the user makes that purchase
    limits:
      rpm: 20
      per_day_default: 50           # credits_purchased: false
      per_day_after_credits: 1000   # credits_purchased: true
    quota_endpoint: /api/v1/key
    require_parameters: true
    data_policy: some_free_endpoints_train
    verified_on: "2026-09-17"

  opencode_free:
    type: hermes_provider
    provider_id: opencode-free
    key_env: null                   # served anonymously: no key, no credential pool
    limits: {}
    data_policy: unknown
    verified_on: "2026-09-17"
    status: blocked                 # 2026-09-18: HTTP 403 "OpenCode's free tier can only be used
                                     # from within OpenCode" -- confirmed against nemotron-3-ultra-free.
                                     # Server-side client check, not a per-model issue; do not retry
                                     # other opencode-free models expecting a different result.

models:
  - provider: unorouter
    model: "glm-5.3-thinking:free"
    context_length: null            # UNVERIFIED. Native config.yaml's model: block has no explicit
                                     # context_length, and hermes doctor did not warn at startup, so
                                     # Hermes likely auto-detected something via its own probing tiers
                                     # -- but auto-detected is not the same as declared. Confirm and
                                     # set this explicitly once verified (ASES-MOD-02).
    tool_calling: true               # verified 2026-09-18, but ONLY with the exact recipe below
    role_class: lead
    pinned: true
    requires:                        # 2026-09-18: without BOTH of these, tool_call_count=0 -- the
                                      # model narrates an intent to act ("I should use ls to...") and
                                      # then stops. Isolation-tested: each alone fails.
      reasoning_effort: low          # hermes -p lead ... needs agent.reasoning_effort: low in config.yaml
      system_prompt_addition: >-
        You must verify facts using your tools before answering - never answer from memory or guess.

  - provider: unorouter
    model: "qwen3.8-27b:free"
    context_length: null            # UNVERIFIED (ASES-MOD-02) -- not yet checked against live catalog
    tool_calling: true               # verified 2026-09-18
    role_class: coder                # its real Phase 3 job (coder-1 profile). Also passed E1/E9/E10
                                      # as a lead candidate in the Phase 2 report -- kept as a
                                      # documented fallback there, but this row's role_class reflects
                                      # what it's actually deployed as today, since policy.py's
                                      # profile_provider() does an exact-match lookup by role for
                                      # budget/data-class checks (a plan task's role: "coder" found
                                      # nothing here before this fix -- its budget was silently never
                                      # checked in Gate P. Real bug, caught by actually running
                                      # `swarm approve` for real, not just unit tests with fakes).
    pinned: true
    requires:
      reasoning_effort: medium       # default reasoning_effort 400s: "invalid Qwen3.8 reasoning_effort"

  - provider: openrouter
    model: "cohere/north-mini-code:free"
    context_length: 256000
    tool_calling: true               # verified 2026-09-18
    role_class: reviewer
    pinned: true
    data_policy: some_free_endpoints_train
