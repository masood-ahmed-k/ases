# ASES project configuration. This is ASES's own config, separate from Hermes's config.yaml.
# See docs/architecture.md for what each field does and which requirement ID it satisfies.

project:
  name: ases
  # Decision D1 (blueprint v1.1/v1.2 section 2.4 and 17.2): environment is "native" or "wsl2".
  # Chosen 2026-09-18: native, on top of the existing working Hermes install. [ASES-ENV-01]
  environment: native
  # public | private | confidential -- section 21.2. Set to public for THIS project deliberately:
  # C:\Users\masoo\ases-workspaces\test-repo-phase3 is throwaway scaffold content (README/AGENTS.md),
  # not real code. Neither UnoRouter nor OpenRouter's current declared data_policy qualifies as safe
  # for "private" (policy.py's _SAFE_FOR_PRIVATE) -- Gate P will correctly REFUSE to approve any plan
  # under data_class: private until a provider with a confirmed no-training/local policy is added.
  # A real project MUST set this deliberately, not inherit this file's value by accident.
  data_class: public
  workspace_root: C:/Users/masoo/ases-workspaces
  ases_home: C:/Users/masoo/ases/data
  board: ases-phase3               # Hermes kanban board; project p_36370687 is bound to it (Phase 3)
  integration_branch: integration

roles:                             # plan task role -> Hermes profile (ASES-ROL-01/09: Phase 3 core three)
  lead: lead
  coder: coder-1
  reviewer: reviewer

concurrency:
  max_in_progress: 3               # written to Hermes kanban.max_in_progress in Phase 3
  per_profile: 1                   # written to Hermes kanban.max_in_progress_per_profile
  hard_max: 6                      # ASES-ROL-08

budgets:                           # section 9.3 global bounds
  attempts_per_card: 3
  review_rounds_per_task: 3
  fix_cards_per_task: 2
  replans_per_project: 2
  max_cards: 40
  card_runtime_minutes: 45
  daily_reserve_percent: 10        # ASES-CAP-03: never plan to use the last 10% of a day's quota
  review_reserve_requests: 20      # requests held back for the review pass on every card

hermes:
  tested_version: "0.21.3"
  native_home: "C:/Users/masoo/AppData/Local/hermes"
