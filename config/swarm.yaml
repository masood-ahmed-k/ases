# ASES project configuration. This is ASES's own config, separate from Hermes's config.yaml.
# See docs/architecture.md for what each field does and which requirement ID it satisfies.

project:
  name: ases
  # Decision D1 (blueprint v1.1/v1.2 section 2.4 and 17.2): environment is "native" or "wsl2".
  # Chosen 2026-09-18: native, on top of the existing working Hermes install. [ASES-ENV-01]
  environment: native
  # public | private | confidential -- section 21.2. Set to public for THIS project deliberately:
  # C:\Users\masoo\ases-workspaces\test-repo-phase3 is throwaway scaffold content (README/AGENTS.md),
  # not real code. Neither UnoRouter nor OpenRouter's current declared data_policy qualifies as safe
  # for "private" (policy.py's _SAFE_FOR_PRIVATE) -- Gate P will correctly REFUSE to approve any plan
  # under data_class: private until a provider with a confirmed no-training/local policy is added.
  # A real project MUST set this deliberately, not inherit this file's value by accident.
  data_class: public
  workspace_root: C:/Users/masoo/ases-workspaces
  ases_home: C:/Users/masoo/ases/data
  board: ases-phase3               # Hermes kanban board; project p_36370687 is bound to it (Phase 3)
  integration_branch: integration

roles:                             # plan task role -> Hermes profile (ASES-ROL-01/09: Phase 3 core three)
  lead: lead
  coder: coder-1
  reviewer: reviewer

concurrency:
  max_in_progress: 3               # written to Hermes kanban.max_in_progress in Phase 3
  per_profile: 1                   # written to Hermes kanban.max_in_progress_per_profile
  hard_max: 6                      # ASES-ROL-08

budgets:                           # section 9.3 global bounds
  attempts_per_card: 3
  review_rounds_per_task: 3
  fix_cards_per_task: 2
  replans_per_project: 2
  max_cards: 40
  card_runtime_minutes: 45
  daily_reserve_percent: 10        # ASES-CAP-03: never plan to use the last 10% of a day's quota
  review_reserve_requests: 20      # requests held back for the review pass on every card

hermes:
  tested_version: "0.21.3"
  native_home: "C:/Users/masoo/AppData/Local/hermes"

# Worker sandbox (blueprint Appendix B and section 21.3; ASES-SEC-03, ASES-SEC-05, ASES-CFG-04).
# ON since 2026-09-28 (round 16, owner's "do all"), after the worker git design (round 15's WORKERGIT) and the image
# passed both real-Docker live checks (scripts/sandbox_live_check.py, scripts/workergit_live_check.py; see
# docs/stage-b-2026-09-28.md). With `enabled` true, `swarm init` writes the Docker terminal block into every worker
# profile, the controller's own gates run in the sandbox (gates.resolve_runner), and `swarm doctor` reports a
# sandbox row that is not green as a failure, not a warning. Setting it back to false returns workers and gates to
# the host, with doctor's sandbox rows as warnings again.
# The other keys are the Appendix B keys and are validated by sandbox.SandboxPolicy: the backend must be docker,
# the mount must be worktree_only, network access is default-deny (network_default: true is refused) and only
# ever opened by an explicit task-scoped exception. Optional keys: cpu, memory_mb, pids_limit, extra_deny (not
# set here, so SandboxPolicy's own defaults apply).
# image (round 15, SANDBOXIMG then WORKERGIT; round 16 added bash): ases-sandbox:py311-3, built from
# docker/sandbox/Dockerfile -- an official python:3.11-alpine base pinned by @sha256 digest, git 2.54 (worker
# worktrees use relative gitdir paths, which need git 2.48 or later inside the container; py311-1's Debian git 2.47
# could not), bash (Hermes runs every Docker terminal command as `bash -c`; py311-2 had none), and pytest==9.1.1, on a
# fixed non-root user (see the Dockerfile's own comment for why: docker_run_as_host_user does nothing on native
# Windows, so this is the closest available substitute for ASES-SEC-03's "the host user"). Pulled and built
# locally with `docker build -t ases-sandbox:py311-3 -f docker/sandbox/Dockerfile docker/sandbox`; `swarm
# doctor`'s sandbox_image row now passes once that build has run (it only checks the image is present locally,
# never builds or pulls it itself).
sandbox:
  enabled: true
  terminal_backend: docker
  network_default: false
  mount: worktree_only
  forward_env: []
  network_exceptions: explicit_allowlist
  image: ases-sandbox:py311-3

# How long ASES keeps what it writes under ases_home (ASES-OBS-02: "Transcripts and logs stay local under a
# retention setting"). `swarm retention` applies these (a dry run unless --apply is given). Each is a whole
# number of days, at least 1. Logs and worker transcripts contain source code, so they are kept for less time
# than reports, which are the audit trail. Without --days, `swarm retention` uses the LONGER of the two, so it
# never removes a file earlier than either setting allows.
retention:
  logs_days: 30
  reports_days: 90

# Gate 4's built-in tree scan allowlist (ASES-TSK-04, section 18.2) is NOT a key of this file. It lives on the
# approved PLAN as a top-level "gate4_allowlist" field (a list of path globs, docs/ases/plan.json), because it is
# a plan-author decision published and reviewed at Gate P by the critic and the user, table 34's "gates the agent
# cannot edit": a worker who can edit config/swarm.yaml (when its touches allow it) must not be able to quietly
# excuse its own planted secret by adding itself to a config-file allowlist. Example, in plan.json next to
# "gate_profiles" and "tasks":
#   "gate4_allowlist": ["tests/**", "docs/**"]
# A finding whose path an allowlist glob covers is dropped from Gate 4's blocking set but stays listed in the
# outcome and the release report, renamed to its "allowed_" kind (finalgates.severity), so what was excused is
# always auditable, never silently invisible.
