- id: ASES-ARC-01
  requirement: ASES uses the Hermes features listed in section 1.2 instead of re-implementing them
  section: '1.2'
  verified_by: Design inspection
  status: covered
  note: 'ROUND 7 wave 2 audit (2026-09-23, zero quota): An inspection agent read the actual code against blueprint
    table 2 (section 1.2) row by row and found the division of labor cleanly respected everywhere it checked,
    each with a citation: durable task state (db.py''s plan_tasks has no status/lifecycle column, only
    pointers and ASES''s own lineage counters; the Kanban board alone is the source of truth), dispatch and
    concurrency (controller.py''s own docstring: ''never claims or spawns a card itself''; dispatch is
    Hermes''s kanban dispatch/gateway, ASES only adds budget-aware parking), worker isolation (hermes.py
    passes --workspace/--branch straight through, ASES never creates a worker''s worktree itself), model per
    task (kanban create --model/--provider, kanban_set_model; policy.py''s own docstring: ''this module does
    not re-pick models, it enforces the budget gate in front of dispatch''), retries and timeouts
    (recovery.py''s own docstring: ''Hermes already retries a card by itself... this module adds the two
    missing pieces: classify_run() and decide()... nothing here calls a provider or starts a process''),
    provider resilience (ledger.py: ''nothing here calls a provider; callers report usage after the fact''),
    review (review.py: the reviewer''s verdict IS the resulting card transition via
    kanban_complete/request_changes/block, no independent verdict engine), planning helpers (kanban_specify
    wraps Hermes''s own auxiliary call), visibility (report.py''s own docstring: ''the Hermes dashboard
    already shows the board, runs, worker logs... so none of that is rebuilt here''), operations (hermes.py
    shells to hermes doctor/pause/resume; killswitch.py wraps, does not replace, hermes pause). No borderline
    cases found.'
- id: ASES-ARC-02
  requirement: The controller never claims cards, spawns workers or keeps its own copy of task status
  section: '3.2'
  verified_by: 22.2, 22.7
  status: covered
  note: 'ROUND 9 register hygiene (2026-09-27, zero quota): Stale claim corrected -- credentials were added to the
    lead/coder-1/reviewer profiles and a real end-to-end dispatch already happened on 2026-09-19
    (docs/architecture.md, ''The first real end-to-end run: lead, coder, reviewer, merge''; project greet-e2e,
    board ases-phase3): swarm approve created four real cards, coder-1 (xKiro qwen/qwen3-coder-plus:free)
    claimed and completed G1, the reviewer (OpenRouter cohere/north-mini-code:free) completed both G1 and G2,
    and the merge queue squash-merged G1 for real. Throughout, the controller itself never claimed a card or
    spawned a worker: Hermes''s own gateway dispatcher did the dispatching, and ASES-QG-01''s note
    independently confirms the merge queue believed only its own gate_runs records during this same run.
    Combined with controller.py''s construction (kanban dispatch/gateway calls only, no claim/spawn call
    anywhere in the module) and the acceptance-level proof at zero quota (22.2 core and 22.7 in
    tests/acceptance/), this requirement is now covered both by a real dispatch and by repeatable tests.
    Earlier note: Phase 3 code (controller.py) never claims/spawns cards -- true by construction. Full
    end-to-end proof (acceptance test 22.2) still pending real dispatch (credentials not yet in the
    lead/coder-1/reviewer profiles).'
- id: ASES-ARC-03
  requirement: ASES records are keyed by card ID and commit SHA; the controller reconciles on start
  section: '3.2'
  verified_by: 22.7, 22.15
  status: covered
  note: 'ROUND 12 (2026-09-28, zero quota, from a verified adversarial audit,
    docs/work-orders/r12_audit_findings.md): Every merge_records write now hits exactly one row and every
    single-row read prefers the project''s own row over a legacy NULL-project row (reconcile, hardening, the
    eval scorer, report, finalgates), closing four audit findings about two rows sharing a task key. Earlier
    note: ROUND 9 (2026-09-27, zero quota): MERGEPK made merge_records project-scoped (schema v8, key
    (project, task_key)), so two projects reusing a task key in one database no longer share a merge record.
    EVENTSPROJ: events.record writes the events.project column (from a keyword argument or the payload''s own
    project; a disagreement raises), every record call site and every FROM events reader was classified, and
    project-scoped readers use one definition, events.PROJECT_SCOPE_SQL (this project''s rows plus rows with
    no project recorded, never another project''s), including the report''s events, quality and health panels
    and the parked-card reasons, each with a two-project test that fails on the old code. Genuinely global
    events (credential health, doctor, eval) stay NULL by design. Earlier note: ROUND 9 register hygiene
    (2026-09-27, zero quota): Stale claim corrected -- reconcile-on-start is built, wired in and proven, not
    ''not built yet''. src/ases/reconcile.py implements reconcile() (section 19.4), called at the start of
    every `swarm run` (cli.py''s _reconcile_on_start, exit code 5 on an unrepaired blocked finding) and before
    `swarm resume`; it is unit-tested and acceptance-proven at all three named crash points (22.7; see
    ASES-REC-03/REC-04) and was real-verified against the live board after the 2026-09-19 run (reconcile.check
    found no findings). ASES-REC-04''s own row already corrected this exact drift back in ROUND 6 (''The
    register''s prior note calling reconcile-on-start not built yet had drifted from the source; corrected
    here'') but that fix was never propagated to this row. Note that ASES-REC-04 itself stays in_progress
    because a real bug in its role-hardcoding was found and fixed as recently as round 7 wave 2 (2026-09-23);
    check that row for the current fine-grained state of the repair logic. The keyed-by-card-and-commit-SHA
    half of this requirement was already correctly reported as done. Earlier note: gate_runs/merge_records
    keyed by task_key+commit_sha exist; reconcile-on-start (crash recovery) not built yet.'
- id: ASES-ARC-04
  requirement: One Hermes wrapper module, JSON or REST over text parsing, pinned Hermes version, no updates
    during a project
  section: '3.2'
  verified_by: '22.1'
  status: covered
  note: 'ROUND 9 register hygiene (2026-09-27, zero quota; corrected 2026-09-27 after review): hermes.py
    line 119 states in its own header comment: `Every one of these prefers --json (ASES-ARC-04)`. The
    condition this row was waiting on is met, but a prior draft of this note overstated which wrappers do
    that, asserting as a directly-confirmed fact that `_kanban_json` and its callers -- create, show,
    block, unblock, specify, and the rest -- all pass --json. Reading hermes.py directly does not support
    that for block, unblock or specify. The actual split: `kanban_create`, `kanban_show`, `kanban_list` and
    `kanban_dispatch` call `_kanban_json` and parse JSON. `kanban_specify` (lines 328-384) passes `--json`
    itself but is not a `_kanban_json` caller: its own docstring says it "Deliberately does NOT reuse
    `_kanban`/`_kanban_json`". `kanban_block` (lines 239-255) calls `_kanban(board, [*args, card_id, "--",
    reason])` and `kanban_unblock` (lines 262-268) calls `_kanban(board, args)`, neither one adding --json
    anywhere in the function; they sit with the many plain text/exit-code wrappers -- `kanban_init`,
    `kanban_link`, `kanban_complete`, `kanban_schedule`, `kanban_comment`, `kanban_promote`,
    `kanban_archive`, `kanban_set_model`, `kanban_reclaim`, `kanban_request_changes` and
    `kanban_reopen_review` -- none of which call `_kanban_json` or pass --json. `hermes doctor` remains the
    one deliberate text-parsing exception outside kanban, justified in the same file: it has no --json flag
    (checked via --help). hermes.py is confirmed the sole module that shells out to Hermes (also
    independently confirmed by the ASES-ARC-01 division-of-labor audit). Version pinning and doctor-gating
    were already correctly reported as done. Read narrowly -- one wrapper module, JSON preferred over text
    where the code actually uses it, and a pinned version with no mid-project updates -- the requirement is
    still met even though most kanban status-change wrappers parse plain exit-code and comment/event text
    by design rather than JSON; whether those specific commands could also emit --json was not re-checked
    against real Hermes here (outside this fix''s scope; flagged separately in the builder report). Earlier
    note: hermes.py is the sole module that shells out to hermes; version pinning and doctor-gating are
    done. hermes doctor itself has no --json flag (checked via --help), so its output is parsed as text by
    design -- true JSON preference applies once Phase 3 needs kanban/board calls, which do have --json'
