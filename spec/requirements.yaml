- id: ASES-GIT-03
  requirement: Merge eligibility needs a green Gate 1 record and a reviewer PASS for the same commit
  section: '8.1'
  verified_by: '22.6'
  status: covered
  note: 'Enforced at merge time since 2026-09-19 (unit and seeded-bug tested; the real runs so far pre-date it).
    process_merge_queue merges a coder task only when: the latest completed run on the work card belongs to
    the reviewer profile; its verdict metadata passes validate_verdict as a PASS (either the blueprint''s
    review_status shape or the Hermes review skill''s review_outcome shape; a contradiction is never a PASS);
    the reviewed commit (the verdict''s own, else the commit the coder''s hand-off named, found by an
    independent nemotron review as a gap) is a prefix of the branch head, and an approval that names no commit
    at all is refused as unbound; and the controller''s OWN green Gate 1 record exists for that exact head,
    else Gate 1 runs then (a green record for an older commit means a later commit voided the review:
    stale_review). merge_task is then told the exact checked SHA, refuses if the branch moved, and squashes
    from the SHA itself. A failed check takes the ordinary failure path (fix card, bounded); a missing or
    malformed verdict is a refusal event once per card. History: downgraded from covered earlier the same day
    because the note only described the Gate 1 half.'
