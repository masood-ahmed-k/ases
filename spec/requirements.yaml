source_docx: ASES_Swarm_Implementation_Blueprint_v1.2.docx
requirements:
- id: ASES-ENV-01
  requirement: ASES runs inside WSL2 Ubuntu (decision D1)
  section: '17.2'
  verified_by: '22.1'
  status: covered
  note: config.py validates project.environment; doctor.py checks it and reports the D1 decision
- id: ASES-ENV-02
  requirement: The Ubuntu distro is opened explicitly, never the docker-desktop default
  section: '17.2'
  verified_by: '22.1'
  status: not_applicable
  note: only applies to the WSL2 path; D1=native was chosen 2026-09-18
- id: ASES-ENV-03
  requirement: Repositories, worktrees, boards and databases live on the Linux filesystem, never under
    /mnt/c or OneDrive
  section: '17.2'
  verified_by: '22.1'
  status: covered
  note: config.py refuses to load a config whose workspace_root/ases_home resolve under OneDrive; doctor.py
    also checks the repo root itself
- id: ASES-ENV-04
  requirement: Hermes is installed inside WSL after a backup; secrets are re-entered, not copied; the
    Windows install stays untouched
  section: '17.2'
  verified_by: '22.1'
  status: not_applicable
  note: only applies to the WSL2 install/migration path; native build reuses the existing verified Hermes
    install instead
- id: ASES-ARC-01
  requirement: ASES uses the Hermes features listed in section 1.2 instead of re-implementing them
  section: '1.2'
  verified_by: Design inspection
  status: not_covered
  note: ''
- id: ASES-ARC-02
  requirement: The controller never claims cards, spawns workers or keeps its own copy of task status
  section: '3.2'
  verified_by: 22.2, 22.7
  status: in_progress
  note: Phase 3 code (controller.py) never claims/spawns cards -- true by construction. Full end-to-end
    proof (acceptance test 22.2) still pending real dispatch (credentials not yet in the lead/coder-1/reviewer
    profiles).
- id: ASES-ARC-03
  requirement: ASES records are keyed by card ID and commit SHA; the controller reconciles on start
  section: '3.2'
  verified_by: 22.7, 22.15
  status: in_progress
  note: gate_runs/merge_records keyed by task_key+commit_sha exist; reconcile-on-start (crash recovery)
    not built yet.
- id: ASES-ARC-04
  requirement: One Hermes wrapper module, JSON or REST over text parsing, pinned Hermes version, no updates
    during a project
  section: '3.2'
  verified_by: '22.1'
  status: in_progress
  note: hermes.py is the sole module that shells out to hermes; version pinning and doctor-gating are
    done. hermes doctor itself has no --json flag (checked via --help), so its output is parsed as text
    by design -- true JSON preference applies once Phase 3 needs kanban/board calls, which do have --json
- id: ASES-ARC-05
  requirement: Only the gateway dispatcher runs; the deprecated standalone daemon never runs next to it
  section: '6.2'
  verified_by: '22.1'
  status: covered
  note: kanban_init/kanban_dispatch wrap the gateway-embedded dispatcher only; no standalone daemon code
    exists anywhere in ASES.
- id: ASES-ARC-06
  requirement: One board per project, bound to the repository through a Hermes project
  section: '6.2'
  verified_by: '22.2'
  status: covered
  note: 'Real proof: cards landed on project p_36370687 (project_id set correctly on every card) once
    config/swarm.yaml''s board: field was corrected -- see the caught bug below.'
- id: ASES-ARC-07
  requirement: In WSL the gateway runs in the foreground under controller supervision
  section: '6.2'
  verified_by: 22.1, 22.13
  status: not_covered
  note: ''
- id: ASES-ARC-08
  requirement: Kanban limits are set explicitly and no default assignee exists
  section: '6.2'
  verified_by: 22.1, 22.5
  status: in_progress
  note: kanban.max_in_progress etc. not yet written into Hermes config.yaml for this board -- still relying
    on defaults.
- id: ASES-ROL-01
  requirement: Phase 3 starts with three core profiles; tester and other roles are added only after measured
    evaluation
  section: 4.1, 16
  verified_by: 22.17 at level L2
  status: not_covered
  note: ''
- id: ASES-ROL-02
  requirement: Profiles are created by cloning from the default profile, with a description
  section: '4.2'
  verified_by: '22.1'
  status: covered
  note: lead/coder-1/reviewer created via `hermes profile create <name> --description ...`, no --clone/--clone-from
    (ASES-ROL-10). doctor.role_profiles confirms all three exist with a model configured.
- id: ASES-ROL-03
  requirement: Role prompts live in SOUL.md and are versioned under prompts/
  section: '4.2'
  verified_by: Inspection
  status: covered
  note: SOUL.md for each profile carries the Appendix C role prompt, versioned in this repo's own profile-setup
    notes (docs/architecture.md).
- id: ASES-ROL-04
  requirement: One process per profile; parallel coders use separate profiles
  section: '4.2'
  verified_by: '22.5'
  status: covered
  note: coder-1 is its own profile/home; kanban.max_in_progress_per_profile enforcement is Hermes's own
    (not re-verified here yet).
- id: ASES-ROL-05
  requirement: 'The Reviewer is independent: different model family and provider, no shared project memory,
    and no product-file write or command-execution tools; Kanban verdict tools remain allowed'
  section: '4.2'
  verified_by: 22.1, 22.6
  status: covered
  note: doctor.reviewer_diversity fails closed if lead and reviewer share a provider; real check confirms
    unorouter vs openrouter today.
- id: ASES-ROL-06
  requirement: Least-privilege toolsets per role
  section: '4.2'
  verified_by: 22.6, 22.11
  status: covered
  note: reviewer's toolset explicitly excludes terminal/code_execution/browser/computer_use; kanban enabled
    for verdicts only.
- id: ASES-ROL-07
  requirement: Worker memory is disabled or scoped per project
  section: '4.2'
  verified_by: Inspection
  status: not_covered
  note: ''
- id: ASES-ROL-08
  requirement: Concurrency starts at 3, is raised only after the recovery tests pass, and never exceeds
    6
  section: '4.3'
  verified_by: 22.5, 22.9
  status: not_covered
  note: ''
- id: ASES-MOD-01
  requirement: Model IDs are discovered, and a capability record is kept per model
  section: '5'
  verified_by: '22.1'
  status: covered
  note: models.py registry + config/models.yaml sync, exercised by tests/unit/test_models.py
- id: ASES-MOD-02
  requirement: Every model used through a custom endpoint has a declared context length of at least 64K
    before first use
  section: '5.1'
  verified_by: '22.4'
  status: in_progress
  note: 'the check mechanism is built and doctor correctly WARNs today: glm-5.3-thinking:free has no declared
    context_length in config/models.yaml yet, so it is not yet fit to pin (see config/models.yaml''s note
    on this)'
- id: ASES-MOD-03
  requirement: Lead, Reviewer and Debugger use pinned model IDs; routers are for workers only
  section: '5.2'
  verified_by: '22.1'
  status: covered
  note: 'Pinned in config/models.yaml 2026-09-18: glm-5.3-thinking:free (Lead, requires reasoning_effort=low
    + verify-don''t-guess system prompt addition) and cohere/north-mini-code:free (Reviewer, different
    family/provider). qwen3.8-27b:free kept unpinned as a documented fallback. See docs/phase2-evaluation-report.md.'
- id: ASES-MOD-04
  requirement: A smoke test through the real Hermes path precedes first use of a model
  section: '5.2'
  verified_by: '22.1'
  status: covered
  note: 'Real smoke tests run 2026-09-18: glm-5.3-thinking:free FAILED (tool_call_count=0, x2), qwen3.8-27b:free
    and cohere/north-mini-code:free PASSED. See docs/phase2-evaluation-report.md. Awaiting user acceptance
    before config/models.yaml is updated.'
- id: ASES-MOD-05
  requirement: Provider health is passive; no timer-based probing
  section: '5.2'
  verified_by: '22.9'
  status: covered
  note: doctor.py never calls a provider; model health is read from stored smoke-test state only, never
    probed on a timer
- id: ASES-CAP-01
  requirement: swarm doctor shows the limits in use and their sources
  section: '5.3'
  verified_by: '22.1'
  status: covered
  note: doctor prints every provider's limits and verified_on date from config/models.yaml
- id: ASES-CAP-02
  requirement: A persisted request ledger per provider, model and UTC day
  section: '5.4'
  verified_by: 22.7, 22.9
  status: covered
  note: ledger.py + requests_ledger table, keyed by provider/model/UTC day; tests/unit/test_ledger.py
- id: ASES-CAP-03
  requirement: No card becomes ready without budget for it plus a review reserve; otherwise it is parked
  section: '5.4'
  verified_by: '22.9'
  status: covered
  note: cmd_approve sums estimated_requests per provider across the whole plan and calls ledger.can_afford
    before Gate P publication; refuses the plan outright if any provider can't cover it today.
- id: ASES-CAP-04
  requirement: Gate P shows estimated requests per provider and the calendar time
  section: '5.4'
  verified_by: '22.14'
  status: covered
  note: cmd_approve prints each provider's budget line (needed vs. affordability reason) as part of the
    Gate P output.
- id: ASES-CAP-05
  requirement: Credit purchases are a user decision; ASES works without them
  section: '5.4'
  verified_by: '22.9'
  status: covered
  note: credits_purchased defaults false in config/models.yaml; ledger.daily_limit() only uses the 1000/day
    figure once a human flips it
- id: ASES-CAP-06
  requirement: Capacity should come from provider diversity, each addition evaluated
  section: '5.4'
  verified_by: Inspection
  status: not_covered
  note: ''
- id: ASES-TSK-01
  requirement: Each plan task becomes a work card and a merge card
  section: '7'
  verified_by: '22.2'
