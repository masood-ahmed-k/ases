- id: ASES-GIT-03
  requirement: Merge eligibility needs a green Gate 1 record and a reviewer PASS for the same commit
  section: '8.1'
  verified_by: '22.6'
  status: covered
  note: 'Enforced at merge time since 2026-09-19 (unit and seeded-bug tested; the real runs so far pre-date it).
    process_merge_queue merges a coder task only when: the latest completed run on the work card belongs to
    the reviewer profile; its verdict metadata passes validate_verdict as a PASS (either the blueprint''s
    review_status shape or the Hermes review skill''s review_outcome shape; a contradiction is never a PASS);
    the reviewed commit (the verdict''s own, else the commit the coder''s hand-off named, found by an
    independent nemotron review as a gap) is a prefix of the branch head, and an approval that names no commit
    at all is refused as unbound; and the controller''s OWN green Gate 1 record exists for that exact head,
    else Gate 1 runs then (a green record for an older commit means a later commit voided the review:
    stale_review). merge_task is then told the exact checked SHA, refuses if the branch moved, and squashes
    from the SHA itself. A failed check takes the ordinary failure path (fix card, bounded); a missing or
    malformed verdict is a refusal event once per card. History: downgraded from covered earlier the same day
    because the note only described the Gate 1 half.'
- id: ASES-GIT-04
  requirement: 'One merge at a time: squash candidate on the integration HEAD, Gate 3, fast-forward, complete
    the merge card'
  section: '8.1'
  verified_by: 22.5, 22.8
  status: covered
  note: 'mergeq.merge_task: squash candidate on integration HEAD in a throwaway worktree, Gate 3, fast-forward
    only if green. Unit-tested incl. conflict and red-gate3 cases. Also seen in a real run on 2026-09-19
    (greet-e2e, task G1): candidate 676628f built on the tip, secret scan clean, Gate 3 (python -m pytest -q)
    pass, fast-forward, merge_records completed, merge card completed with the squash SHA. A review-only task
    completes its merge card as a recorded no-op instead (nothing to fast-forward).'
- id: ASES-GIT-05
  requirement: The integration branch stays runnable; post-merge failures are reverted
  section: '8.1'
  verified_by: '22.8'
  status: partial
  note: 'ROUND 6 (2026-09-22, zero quota): The post-merge revert trigger is now wired: after every real coder
    merge, Gate 3 re-runs on the new integration HEAD (gate3-postmerge); green proceeds as before;
    red-and-revert-succeeds takes the ordinary fix-card path; red-and-revert-also-fails halts the run
    (integrity_violation). mergeq.revert_merge itself is fixed to only mark reverted=1 on a real git success
    and to run `git revert --abort` on a conflicted revert rather than leaving the primary checkout
    mid-revert. Acceptance-proven for the crash-safety half via 22.7''s reconcile scenarios. Left partial: a
    real post-merge failure triggering an ACTUAL revert has not been exercised in a real run, only in unit and
    crash-simulation tests, and the merge_records primary-key collision below (a different bug) is a separate,
    still-open risk for two projects reusing a task key. Earlier note: Downgraded from covered 2026-09-19 by
    an adversarial pipeline review, independently verified against the real source. The "stays runnable" half
    is genuinely covered: merge_task''s conflict and red-Gate-3 paths return before touching the real
    integration branch, confirmed in tests. The "post-merge failures are reverted" half is not:
    mergeq.revert_merge exists and has its own unit test, but nothing in src/ases ever calls it --
    controller.process_merge_queue only calls merge_task, so a merge that lands and is later found broken has
    no automatic trigger for the revert.'
