- id: ASES-REC-06
  requirement: swarm stop halts everything within 30 seconds
  section: '19.6'
  verified_by: '22.13'
  status: covered
  note: 'swarm stop: hermes pause (halts new dispatch) + reclaim every running card, event-logged. Verified
    for real (0 running cards, clean pause/resume cycle). Deliberately does not hunt/kill arbitrary hermes.exe
    processes -- no reliable way to distinguish an ASES worker''s PID from an unrelated Hermes chat session
    the user has open; pause+reclaim already gives the real safety property per Hermes''s own reclaim
    semantics.'
