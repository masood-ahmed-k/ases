    rules are never relaxed to keep work flowing
  section: '21.2'
  verified_by: '22.16'
  status: in_progress
  note: 'ROUND 19 (2026-09-29, zero quota): config/models.yaml records only data policies verified from official sources
    with URL and date; no configured provider qualifies for private data. A model-level policy no longer borrows the
    provider''s verified date, the Lead, critic and reviewer are all checked (STOPGATES), and the OpenRouter
    reviewer profile refuses data-collecting providers (PROFILEGUARDS). Status unchanged. Earlier note: ROUND 7 wave
    1 (2026-09-22, zero quota, one real Hermes call authorized only for kanban_specify): policy.check_data_class
    gained a required, explicit verified_at for private/confidential (a compatible policy string alone is no longer
    enough); config.py validates the two new optional provider fields (data_policy_verified_at, data_policy_source);
    cli.cmd_approve''s Gate P check threads the new field through. Found and fixed the one real regression this
    caused: recovery.next_model called check_data_class without verified_at, so every switch-model candidate was
    silently treated as unsafe for private/confidential once the stricter check landed; fixed to thread the same
    field through, mirroring the existing policy-string fallback. Unit-tested; config/models.yaml documents the new
    fields as comments, no real dates recorded yet (a human verification decision, not invented here).'
