- id: ASES-GIT-06
  requirement: Squash merge only, one commit per plan task with the card ID
  section: '8.1'
  verified_by: '22.2'
  status: covered
  note: mergeq.py always squashes (git merge --squash); test_squash_produces_one_commit_not_the_branchs_history
