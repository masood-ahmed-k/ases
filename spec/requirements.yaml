  requirement: Infrastructure failures resume; capability failures restart fresh with the failure bundle
    and then a new model
  section: '19.2'
  verified_by: 22.3, 22.6
  status: in_progress
  note: 'ROUND 7 wave 1 (2026-09-22, zero quota, one real Hermes call authorized only for kanban_specify): A real,
    previously-documented gap closed: a card stuck ready after an auth- or quota-shaped failure that never
    tripped Hermes''s own retry breaker was invisible to recovery.process_failures (which only ever examined
    blocked cards; its own docstring said so). It now also recovers a ready card whose latest run is auth- or
    quota-classified, once a 30-second settle window has passed (reusing the existing infra-backoff base; real
    Hermes''s own DEFAULT_CRASH_GRACE_SECONDS independently agrees at 30s for a comparable judgment),
    deliberately excluding every other failure kind on a ready card to avoid racing Hermes''s own normal retry
    cadence. Unit-tested with the exact scenario round 6''s acceptance test found. Earlier note: ROUND 6
    (2026-09-22, zero quota): Acceptance-proven end to end (22.3): one card walked through all four failure
    classifications via the real controller.process_recovery -- rate-limit (Hermes retries alone),
    infrastructure (resumed after backoff), auth (marks the credential unhealthy as a question, answered), and
    two rounds of capability failures (a fresh-attempt card, then a model-switch card pinned to a declared
    candidate) which finally succeeds, ending with exactly the right number of cards, no loss or duplication.
    A REAL GAP surfaced: a card that crashes ONCE with genuinely auth- or quota-shaped error text, short of
    tripping the retry breaker, can get permanently stuck in ready, respawn-guarded by Hermes itself, and
    NEVER reach recovery.py at all (which only examines blocked cards) -- worth checking against real Hermes
    before relying on this failure class being handled. Earlier note: BUILT AND WIRED, NOT RUN FOR REAL
    (2026-09-22): recovery.py is called from controller.process_recovery every pass: a capability failure
    becomes a fresh attempt card (fresh worktree, failure bundle attached), the second also pins the next
    model of the role class on the new card, an infrastructure failure resumes after a backoff, auth, policy
    and context failures become a question, and a decision the controller could not carry out is redriven from
    the event log. Not run for real; the provider name for `hermes kanban set-model` on a custom endpoint is
    unverified.'
