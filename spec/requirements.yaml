    (T1/T2 work+merge). Previously unit-tested only.'
- id: ASES-TSK-02
  requirement: Dependencies link a child's work card to the parent's merge card; done on a merge card
    means merged
  section: '7'
  verified_by: 22.5, 22.8
  status: covered
  note: 'Real proof: T2''s work card (depends_on T1) sits in real Hermes status ''todo'' because it''s
    parented to T1''s MERGE card, which is still ''blocked'' -- confirmed on the live board, not just
    asserted in a mock.'
