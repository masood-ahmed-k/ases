- id: ASES-GIT-16
  requirement: ASES worktrees start from the exact local integration HEAD; worktree_sync is disabled or
    manual creation is used
  section: '8'
  verified_by: 22.2, 22.5
  status: covered
  note: 'STAGE A APPLIED and STAGE C (2026-09-28, real Hermes, real providers, owner''s ''do all'';
    docs/stage-c-2026-09-28.md): worktree_sync is false on the real profiles, and the round 10 base-commit
    check verified both real cards'' bases (card_base_verified x 2) with the integration heads recorded in
    integrity_heads; Hermes''s Kanban dispatcher cuts worktrees from the local HEAD, which is what the check
    confirms. Earlier note: ROUND 14 (2026-09-28, zero quota, second audit A2-1): a running card whose branch
    never appears is still never blocked, but after 5 passes a card_base_branch_unverifiable event names it,
    so the skip is bounded and visible; the merge-queue refusal remains the enforcement. Earlier note: ROUND
    12 (2026-09-28, zero quota, from a verified adversarial audit, docs/work-orders/r12_audit_findings.md):
    The base-commit check no longer blocks a card whose branch Hermes has not created yet (Hermes marks the
    card running before it runs git worktree add): such a card is re-checked next pass, while an existing
    branch with a wrong or unreadable base still blocks, and the merge-queue refusal stays the backstop.
    Earlier note: STAGE A (2026-09-28, zero provider quota): a real swarm doctor against the real Hermes
    0.21.3 install and the swarm init --global dry run (docs/stage-a-2026-09-28.md) show core.logAllRefUpdates
    is on in the real test repository, so the round 10 base-commit check can read branch reflogs there;
    worktree_sync is still on in the real profiles (swarm init sets it off, pending the owner''s yes), which
    per the Hermes source only `hermes -w` reads anyway. Earlier note: ROUND 10 (2026-09-27, zero quota):
    BASECHECK built the check blueprint p169''s last sentence asks for: guards.check_card_base reads a work
    branch''s creation commit from its reflog (git forced to the C locale so the message is never translated)
    and requires it to be an integration head ASES itself wrote or adopted, kept in a new integrity_heads
    history table (schema v9, backfilled), so a card dispatched before a later merge still passes. It runs
    twice: every pass checks each running card once and blocks a wrong or unverifiable base through the
    question path, and the merge queue refuses such a branch outright, so a wrong base can never land even if
    detection missed it. ''Before a worker starts'' is enforced as ''on the first pass that sees it running,
    and never mergeable'', because Hermes, not ASES, starts the worker. swarm doctor --repo checks
    core.logAllRefUpdates, which the check needs. Acceptance-tested on the fake board
    (tests/acceptance/test_r10_basecheck.py); never run against a real dispatch. worktree_sync is pinned false
    (round 5) and, per the Hermes 0.21.3 source, the Kanban dispatcher never syncs from a remote at all; the
    remaining gap is only that the check has not run against a real dispatch. Earlier note: ROUND 9 T2B
    (2026-09-27, zero quota): Read against the installed Hermes 0.21.3 source (read only). worktree_sync is
    already pinned: profiles._config_rows sets worktree_sync: false on every ASES-managed profile (built in
    round 5, citing this row), and profiles._check_profile reports a live profile that has it on; T2B made
    swarm doctor tag that drift row with ASES-GIT-16 itself (doctor._extract_requirement_ids), so a drifted
    value names this requirement. Still partial for two reasons, both honest: the remote-tip case this row
    guards against has never been exercised (the real test repo has no remote), and the second half of p169,
    ''Phase 3 MUST verify the actual base commit before a worker starts'', is not built anywhere (listed as a
    new, separate work item; ASES-GIT-01 is set back to partial for the same reason). Earlier note: Observed
    on the real 2026-09-19 run: the work-card worktree Hermes created on dispatch was cut at the exact
    integration tip both times (232e12e for G1, 676628f for G2 after G1 merged), and the gate and merge
    worktrees ASES makes itself are detached at exact SHAs. Left partial: the test repo has no remote, so
    Hermes''s default of syncing a worktree from the freshly fetched remote tip (the case this requirement
    guards against) was never exercised, and whether worktree_sync must be turned off explicitly is
    unverified.'
- id: ASES-CFG-05
  requirement: UnoRouter custom-endpoint credentials use Hermes custom-endpoint secret handling; do not
    export provider keys into worker shells
  section: 10, 17.4
  verified_by: '22.10'
  status: partial
  note: 'ROUND 9 (2026-09-27, zero quota): GITHARDEN closed the sibling exposure round 8''s sweep proved (the
    controller''s other git calls: hooks, core.fsmonitor, textconv, all with the full environment). The one
    structural gap below remains: a Hermes-gateway-dispatched worker is spawned by Hermes, which ASES cannot
    scrub. Earlier note: ROUND 8 (2026-09-27, zero quota): The deferred gates.py gap is closed.
    gates._run_commands (the host gate runner) and run_gate''s own git worktree add/remove now start every
    subprocess with procenv.scrubbed_environ(), so model-authored code under Gate 1/3/4/5 and a post-checkout
    hook planted in the shared .git/hooks cannot read a provider key from the controller''s shell; proven
    before/after (the old code printed KEYSEEN and the hook recorded the key), plus a new acceptance test
    tests/acceptance/test_22_10_gate_env.py through a real controller pass. procenv exempts
    GIT_AUTHOR_NAME/EMAIL/DATE by exact name (they match the pattern only on ''auth''); SSH_AUTH_SOCK and
    XAUTHORITY stay stripped (capability-bearing). No pass-through allowlist (a gate that needs a credential
    fails visibly). A read-only sweep then proved the same exposure in the controller''s OTHER git calls
    (hooks, core.fsmonitor, textconv in a repository a local-backend worker can write); round 9''s GITHARDEN
    package addresses that. Stays partial: a Hermes-gateway-dispatched worker is spawned by Hermes itself,
    which no ASES-side scrub can reach (see below). Earlier note: ROUND 7 wave 2, CFG-05 close-out
    (2026-09-23, zero quota): The still-live ''do not export provider keys into worker shells'' half now has a
    real fix, not just an inspection finding. New module src/ases/procenv.py (stdlib-only, no ASES imports)
    defines the project''s one credential-name pattern and scrubbed_environ(); every real subprocess launch of
    the hermes CLI that ASES''s own code controls now uses it: hermes.py''s _run (every
    kanban/doctor/pause/resume call), evals.py''s _run_process (the one live one-shot model call the
    evaluation harness makes), cli.py''s _run_lead (the swarm plan Lead call), critic.py''s default_invoke
    (the swarm critique reviewer call), and profiles.py''s real hermes profile create call via a new
    _hermes_runner wrapper. A real design constraint surfaced and was respected rather than shortcut: the
    scrub could not be a public function of hermes.py itself, because ases.fakes.board.FakeHermes.install
    requires a fake for every public function defined there, and an env scrub is not a Hermes call; procenv.py
    exists as its own module for exactly that reason. profiles.py''s fix deliberately did NOT make
    sandbox.default_runner scrub for every command it runs, because that runner also drives the Docker
    sandbox''s own key-leak probes (key_visibility_test, exfiltration_probe), which need to see a real,
    unscrubbed environment to actually detect a regression; scrubbing there would have blinded the probes that
    exist to catch this exact class of bug. Every fix proven with a before/after test (git stash revert,
    confirm the credential leaks through, restore, confirm it does not). Two independent adversarial tests
    (one per build) additionally confirmed no leak survives. Full suite: 5512 passed, 2 skipped, 0 failed. Two
    things remain honestly out of reach or out of scope, not hidden: (1) a real, Hermes-gateway-dispatched
    worker (the actual coder-1/lead/reviewer agent process during a live swarm run) is spawned entirely by
    Hermes''s own gateway, a process ASES never touches (confirmed by the ASES-ARC-01 audit), so no ASES-side
    env= fix can reach that path; if a key leaks there, it is because the human operator exported it into the
    shell that starts the Hermes gateway itself, which the blueprint already tells them never to do, and
    nothing in ASES''s own code could control that even in principle; (2) a separate, genuine, deferred gap
    two independent agents found and correctly declined to patch under this fix''s scope: gates.py''s
    _run_commands runs the project''s own gate commands with shell=True and the operator''s full, unscrubbed
    environment, so a model-authored test committed to the repo could read a key from the controller''s own
    shell during a gate run -- same family as ASES-SEC-01/03, a real design decision (COMSPEC/PATH must
    survive; sandbox runners bypass this path already) for a future session, not a two-line fix. Also worth a
    human decision, not a bug: the shared credential pattern also strips SSH_AUTH_SOCK/XAUTHORITY on POSIX and
    SESSIONNAME on Windows from every scrubbed launch (informational names, but would affect an
    ssh-agent-backed git push from a Lead''s terminal tool). Stays partial: the UnoRouter half is moot, the
    worker-shell half is now substantially and verifiably fixed for everything ASES''s own code launches, but
    the row''s full scope (every worker shell, including gateway-dispatched ones) has a structural gap ASES
    cannot close from its own side. Earlier note: ROUND 7 wave 2 audit (2026-09-23, zero quota): The
    UnoRouter-credential half is moot (UnoRouter dropped as a provider entirely, confirmed against
    config/models.yaml). For the still-live ''do not export provider keys into worker shells'' half, an
    inspection agent confirmed the existing note''s claim precisely: ASES never spawns a worker process itself
    (hermes.py''s _run only ever calls kanban/doctor/pause/resume/gateway status, never a worker/agent spawn;
    dispatch is Hermes''s own gateway, entirely outside ASES''s process tree), and ASES never reads a key''s
    VALUE, only its key_env NAME, everywhere config.py/doctor.py/profiles.py touch it. The Docker sandbox path
    has real, tested guards (sandbox.py''s docker_run_argv and check_terminal_block, unit-tested), but the
    sandbox is off by default and no real profile uses it today, so those guards do not apply to the local
    backend ASES actually runs. The audit additionally found one concrete, narrow, previously-unlisted gap:
    hermes.py''s _run and evals.py''s _run_process (the one function that makes a real, live one-shot hermes
    call for an evaluation task) both launch the real hermes CLI while inheriting the full ambient process
    environment, completely unfiltered, unlike evalkit/codeeval.py''s existing scrubbed_env pattern used for a
    related but different purpose. A fix (scrub credential-shaped environment variable names before either
    subprocess call, mirroring the existing pattern) was dispatched as a separate
    build-and-independently-verify task; see the next register update once that lands. Until then this row
    stays partial: satisfied by design for everything ASES''s own config/profile code touches, tested for the
    Docker sandbox path only, genuinely unverified for the local backend ASES actually uses by default today.
    Earlier note: PARTIAL CORRECTION (2026-09-22): the UnoRouter-specific half of this row is obsolete --
    UnoRouter was dropped from every role on 2026-09-19 ([[feedback_no-unorouter]] in the operator''s own
    notes; lead and coder-1 now run on xKiro, an unrelated custom-endpoint provider, the reviewer on
    OpenRouter). The row is NOT marked not_applicable, because its second half (''do not export provider keys
    into worker shells'') is a live, general guarantee that still matters for xKiro or any future custom
    endpoint, and is partially covered by sandbox.py''s ASES-CFG-04 work (no credential-shaped variable is
    ever forwarded into a container argv) -- that coverage is for the DOCKER sandbox path only, not the local
    terminal backend ASES still runs on by default, so this row stays not_covered until the local-backend half
    is checked or the sandbox is actually enabled.'
