- id: ASES-ROL-05
  requirement: 'The Reviewer is independent: different model family and provider, no shared project memory,
    and no product-file write or command-execution tools; Kanban verdict tools remain allowed'
  section: '4.2'
  verified_by: 22.1, 22.6
  status: partial
  note: 'ROUND 19 (2026-09-29, zero quota): REVIEWLADDER (merge 925d2b6): pre_tool_call hooks on reviewer profiles deny
    write_file, patch, skill_manage, kanban_request_review, kanban_unblock and kanban_link in-run (the hook fails
    open under HERMES_SAFE_MODE; doctor warns), and turn a stop that only asks for test evidence back into a tool
    error; MERGEGUARD checks independence at merge from the ledger. Not yet exercised by a real reviewer run, and
    the configured reviewer model still cannot follow its contract (the owner''s decision). Status unchanged.
    Earlier note: S1 FINISH (2026-09-29, real Hermes, real OpenRouter reviewer, docs/stage-c-2026-09-28.md
    addendum): the reviewer model (OpenRouter cohere/north-mini-code:free) cannot follow the reviewer contract: it
    asked for test evidence three times across two days (a request for changes on 2026-09-28, then two word-for-word
    identical blocks on 2026-09-29, the second under reviewer prompt version 3, which forbids exactly that, with a
    sandboxed PASS gate record on the card). Hermes moved S1 to triage on the block loop. Choosing another reviewer
    model or provider (different family and provider from the Lead) is the owner''s decision. Status unchanged.
    Earlier note: ROUND 10 (2026-09-27, zero quota): Owner decision (2026-09-27): the reviewer keeping the combined
    file toolset is accepted as a documented residual risk until the Docker sandbox''s read-only mount closes it; no
    interim guard. CALLERS made the risk visible: profiles.residual_risks() is printed by swarm init and shown as
    INFO rows by swarm doctor. Earlier note: doctor.reviewer_diversity fails closed if lead and reviewer share a
    provider; real check confirmed unorouter vs openrouter on 2026-09-18, and confirms xkiro vs openrouter today
    (2026-09-19, after lead moved off unorouter entirely per an explicit user decision -- see docs/architecture.md).
    Downgraded from covered after the first real review: the reviewer has no command tool (its terminal call failed
    with "Tool terminal does not exist"), but its tool list includes write_file and patch, because Hermes toolsets
    are per group (file is reads and writes together) and this version has no per-tool deny. So "no product-file
    write" is not enforced by profile configuration; a read-only sandbox mount (Phase 5) is.'
