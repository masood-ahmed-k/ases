- id: ASES-GIT-08
  requirement: Tasks with overlapping touches and no dependency path are serialized by Gate 0
  section: '8.2'
  verified_by: '22.8'
  status: covered
  note: 'Built 2026-09-19 (phase-completion round 1): plan.serialize_overlapping_tasks runs at the end of Gate 0
    (parse_and_validate), after the dangling-dependency and cycle checks. Two tasks with overlapping touches
    and no dependency path in either direction get a serialization link, the later task in plan order
    depending on the earlier one (priority = position in the plan); links added earlier in the same pass count
    as paths, so three overlapping tasks become a chain, and the function is idempotent. Overlap is decided
    conservatively (over-serialising only costs parallelism), including character classes, verified by a
    brute-force oracle over millions of glob pairs and 300 seeded random plans. swarm approve prints what was
    serialized, and the Lead''s prompt now explains that touches must be globs (dir/** for a directory). Unit
    and seeded-bug tested; the parallel acceptance test (22.5) has not been run for real yet.'
- id: ASES-GIT-09
  requirement: Conflicts become fix or reconciliation cards, never an argument between the two workers
  section: '8.2'
  verified_by: '22.8'
  status: partial
  note: 'process_merge_queue creates a fix card on a merge conflict or red Gate 3 (bounded by
    fix_cards_per_task, escalating to a block once spent). A 2026-09-19 adversarial pipeline review found
    the lifecycle behind it was broken, and it is fixed: plan_tasks.work_card_id is now repointed at the
    fix card when one is created, so the merge queue waits for the fix card to reach done, merges the FIX
    card''s branch, and process_review_lane and process_budget_gate can see it; fix cards are created
    under the original card''s real Hermes project_id (not the ASES-internal label); and a benign
    fast-forward race (Gate 3 passed, integration moved) no longer costs a fix card. The two design
    decisions that review left open were then implemented the same day: (1) the race branch is exact, only
    a git-verified move of the integration tip earns the free retry, a non-race ff-only refusal (dirty
    checkout, unverifiable lookup) takes the ordinary failure path bounded by fix_cards_per_task, and
    merge_task refuses to run unless the primary checkout is on the integration branch; (2) a re-approve
    no longer resets the repoint (create_cards_from_plan keeps work_card_id once fix_cards is above zero).
    Covered by a real-git lifecycle test (conflict, fix card, fix done, fix branch merges), a two-round
    chain test, real-race and dirty-checkout tests, and three re-approve tests. Left partial, not covered:
    never exercised against a real Hermes dispatch. Note plan_tasks no longer records the original work
    card id once a fix exists (it survives in the cards_created event).'
