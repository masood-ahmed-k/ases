- id: ASES-GIT-12
  requirement: Integrity snapshots around every worker run; changes outside the worktree fail the card
  section: '8.4'
  verified_by: 22.5, 22.11
  status: partial
  note: 'BUILT, NOT WIRED (2026-09-19): guards.py now also snapshots the OTHER worktrees (list_worktrees,
    check_idle_worktrees, refresh_snapshots; schema v6 worktree_snapshots) so a change in a worktree no
    running card owns is reported; not called from run_pass yet, and a card re-dispatched into the same
    worktree between two polls must be excluded by the caller. Earlier note: Built 2026-09-19:
    guards.check_primary_checkout runs at the start of every controller pass and at swarm run start. The
    primary checkout must be on the integration branch, clean (modified, staged, deleted and untracked files,
    except Hermes''s .worktrees/), and at the HEAD ASES itself last wrote (adopted at run start, updated after
    every fast-forward it makes). A violation records an integrity_violation event and halts the run with exit
    code 3 before anything is dispatched or merged. Two deviations from the blueprint text, on purpose: the
    check is per pass, not around each spawn (Hermes, not ASES, spawns workers), and it halts the run instead
    of failing one card (the writer cannot be attributed to a card). Not covered: the other active worktrees
    (a stray write into another worker''s worktree) and changes outside git entirely; on 2026-09-19 coder-1
    ran pip install into Hermes''s own virtualenv unnoticed, which only the Docker sandbox (ASES-SEC-03)
    prevents. integrity.py''s own snapshot() has quirks (non -z porcelain quoting, rename strings, fail-open
    on a non-repo) that make this note''s earlier claim that it was fully unit-tested overstated; guards.py
    does not use it.'
- id: ASES-GIT-13
  requirement: Diffs outside the declared touches block review
  section: '8.4'
  verified_by: '22.12'
  status: covered
  note: 'The touches check now runs in BOTH places (2026-09-19): review.gate_before_review before Gate 1 in the
    review lane, and review.check_branch_for_merge inside the merge queue, so a card the review lane never saw
    (Hermes''s gateway dispatcher can claim a review card first) cannot merge out of scope. Out-of-scope
    changes are refused with the exact offending paths. Fixed with it: git diff detects renames, so `git mv
    SECRETS.md src/a.py` hid the removed out-of-scope path (now --no-renames), and a missing merge-base fails
    closed. Earlier the same day the merge-base lookup stopped using a hardcoded integration branch name. Side
    effect worth knowing: fix cards are policed against the ORIGINAL task''s touches, so a fix that must edit
    an out-of-scope file bounces until the plan is widened. Unit and seeded-bug tested.'
