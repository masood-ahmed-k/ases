- id: ASES-REV-06
  requirement: The verdict is a tool call with schema-checked metadata stored by commit
  section: '13.2'
  verified_by: '22.6'
  status: covered
  note: 'Built 2026-09-19 (unit and seeded-bug tested, not yet seen in a real run beyond the reviewer''s real
    metadata shape): review.validate_verdict checks the reviewer''s run metadata against a schema and accepts
    both the blueprint''s shape (review_status PASS, CHANGES_REQUIRED or BLOCKED, commit, summary, the issue
    lists, gate_tampering_suspected, required_changes) and the shape Hermes''s own review skill produces
    (review_outcome approved, reviewer_checks), which is what the real reviewers emitted. Only the status or
    outcome is required; every other field is type-checked when present; a contradiction between the two
    shapes is never read as PASS; a quoted commit must be hex. record_verdict stores the accepted verdict by
    (project, task, commit SHA), redacted, idempotently. The merge queue refuses a coder task whose verdict is
    missing, malformed or not a PASS. The verdict-as-a-tool-call half is Hermes''s own: request-changes,
    complete and block are its verdict tools.'
