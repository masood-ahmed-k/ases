- id: ASES-MOD-02
  requirement: Every model used through a custom endpoint has a declared context length of at least 64K
    before first use
  section: '5.1'
  verified_by: '22.4'
  status: in_progress
  note: 'ROUND 9 register hygiene (2026-09-27, zero quota): The specific evidence this note cites is stale --
    glm-5.3-thinking:free is no longer in config/models.yaml at all. It was hosted on UnoRouter, which ''was
    removed entirely 2026-09-19, per an explicit user decision ("dont use unorouter at all - its complete
    waste")'' (config/models.yaml''s own provider-block comment); the lead role it used to fill moved to
    xKiro''s qwen/qwen3.8-max:free (context_length 1050000, pinned: true). Checked every model currently
    declared in config/models.yaml: none has context_length: null, and every custom-endpoint (xkiro, type
    openai_compatible) model in use or candidate today declares context_length far above the 64K floor
    (qwen3.8-max:free and qwen3-coder-plus:free at 1,050,000; minimax-m3:free at 1,000,000; minimax-m2.5:free
    at 204,000) -- so doctor''s WARN-on-null-context path does not currently fire for anything live. That
    said, the row''s actual requirement (the controller MUST reject an under-declared model before any card
    starts, per blueprint 22.4''s wording) is still not built: grepping controller.py, policy.py and gates.py
    for MINIMUM_CONTEXT_LENGTH / context_declared_and_sufficient finds no caller -- only doctor.py (a
    report-time WARN) and recovery.py (a reactive, post-hoc failure classification after a card has already
    run) use the check. Status stays in_progress: the specific stale example is corrected and the field is
    honestly clean today, but pre-dispatch enforcement is the part of this requirement that does not exist
    yet, not a warning about one now-removed model. Earlier note: the check mechanism is built and doctor
    correctly WARNs today: glm-5.3-thinking:free has no declared context_length in config/models.yaml yet, so
    it is not yet fit to pin (see config/models.yaml''s note on this)'
