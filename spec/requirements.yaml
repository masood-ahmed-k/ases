- id: ASES-CAP-03
  requirement: No card becomes ready without budget for it plus a review reserve; otherwise it is parked
  section: '5.4'
  verified_by: '22.9'
  status: partial
  note: 'ROUND 7 wave 1 (2026-09-22, zero quota, one real Hermes call authorized only for kanban_specify): A real
    bug fixed this round: create_cards_from_plan used to forget a task''s fix or retry card (or, for a retry
    card specifically, create a genuine DUPLICATE work card) if the ASES database was deleted and card
    creation re-run a third time, since both of its ''does a fix/retry card already exist'' signals lived only
    in that database. It now asks the BOARD directly (the merge card''s own parent lineage, disambiguated by
    each candidate''s created_at, never by id or list order, since real Hermes card ids are RANDOM and only
    the fake board''s happen to be sequential -- a subtlety the builder''s report documents precisely, worth
    reading before anyone builds similar board-native recovery logic). Acceptance-tested for both the fix-card
    and retry-card case. Earlier note: ROUND 6 (2026-09-22, zero quota): Acceptance-proven end to end (22.9):
    a card over the daily budget is parked (scheduled, budget: reason), an independent affordable task
    proceeds normally, several idle passes show exactly one card_parked_for_budget event with no thrashing and
    the fake provider never started, the report shows the reset time, no purchase language appears anywhere,
    and after the simulated UTC-midnight reset the card unparks and completes with the other task''s state
    intact. Left partial: the review-reserve half and the daily-reset arithmetic against a REAL
    Hermes/provider are still unverified, and ledger.py has no injectable clock (tests must monkeypatch
    ledger._today directly). Earlier note: Three layers, all unit-tested: cmd_approve checks the whole plan''s
    budget at Gate P; controller.process_budget_gate re-checks every ready card on every pass and parks it
    with hermes kanban schedule when the budget is gone; and, since 2026-09-19, the ledger sees REAL usage:
    usage.ingest_run_usage runs first in every pass and counts each finished worker session once (Hermes
    session export, api_call_count, idempotent through the usage_ingested table, attributed to the plan task
    so lineage requests can be summed), and the outgoing card of a fix-card repoint is ingested just before
    the repoint. The review half of the requirement is applied too: ready coder cards are parked when the
    REVIEWER''s provider cannot afford the review reserve (the reserve is counted once, not twice). This
    closes the gap an adversarial review found (record_usage had no production caller; one review really used
    37 of OpenRouter''s 50 daily free requests unseen). Left partial: a card parked for budget is not yet
    unparked when the provider''s window resets (a human or cron action today), a backlog is charged to the
    day it is first ingested, and none of this has run in a real dispatch yet.'
