- id: ASES-CAP-06
  requirement: Capacity should come from provider diversity, each addition evaluated
  section: '5.4'
  verified_by: Inspection
  status: in_progress
  note: 'The blueprint''s real text (section 5.4) is a 4-step process -- discovery, smoke test,
    data-policy check, evaluation -- plus an explicit warning not to assume extra keys on one account
    add quota. The data-policy-check step is generic and already covered by policy.check_data_class
    (ASES-PRV-01/02/03, wired into cmd_approve); the smoke-test step is covered by models.py''s
    record_smoke_test, already exercised for real (xkiro/qwen/qwen3.8-max:free shows smoke=pass). Real
    discovery + evaluation happened for real 2026-09-19: xKiro was added and evaluated as a genuine
    second, independently-accounted provider, and UnoRouter was run for real, found unreliable (an
    undocumented daily token cap, an output-tokens-per-minute cap, a refused dangerous gate command,
    recurring transient failures) and dropped entirely -- see docs/architecture.md''s dated D2/D3
    sections. Left at in_progress rather than covered because (a) the "don''t assume extra keys share a
    quota" warning has no code check anywhere and can only be verified by a live call to a provider''s
    own account/key-info endpoint, and (b) there''s no repeatable artifact (checklist/template) that
    would make discovery+evaluation hold for the *next* provider addition -- only a one-time real
    instance exists so far.'
