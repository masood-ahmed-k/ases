  section: '7.3'
  verified_by: '22.14'
  status: covered
  note: plan.py Gate 0 rejects a task missing acceptance/touches/gate_profile. Unit-tested (14 cases).
- id: ASES-GIT-01
  requirement: One worktree per work card, branched from the exact integration HEAD
  section: '8'
  verified_by: 22.2, 22.5
  status: in_progress
  note: mergeq/gates verified against a real git repo in unit tests; the *real* Hermes-created worktree
    (--workspace worktree) hasn't been exercised yet pending credentials.
- id: ASES-GIT-02
  requirement: Only the merge queue writes to the integration branch
  section: '8.1'
  verified_by: 22.2, 22.11
  status: covered
  note: mergeq.py is the only module that ever touches the integration branch; gates.py/review.py never
    call git merge/push on it.
- id: ASES-GIT-03
  requirement: Merge eligibility needs a green Gate 1 record and a reviewer PASS for the same commit
  section: '8.1'
  verified_by: '22.6'
  status: covered
  note: review.gate_before_review re-runs Gate 1 on the branch head before a card is trusted in review.
- id: ASES-GIT-04
  requirement: 'One merge at a time: squash candidate on the integration HEAD, Gate 3, fast-forward, complete
    the merge card'
  section: '8.1'
  verified_by: 22.5, 22.8
  status: covered
  note: 'mergeq.merge_task: squash candidate on integration HEAD in a throwaway worktree, Gate 3, fast-forward
    only if green. Unit-tested incl. conflict and red-gate3 cases.'
- id: ASES-GIT-05
  requirement: The integration branch stays runnable; post-merge failures are reverted
  section: '8.1'
  verified_by: '22.8'
  status: covered
